name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint, test, train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff + black)
        run: |
          ruff check src tests
          black --check src tests

      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Download dataset (smoke)
        run: python -m src.data.download

      - name: Train model (smoke)
        run: python -m src.models.train

      - name: Upload model artefact
        uses: actions/upload-artifact@v4
        with:
          name: heart-pipeline
          path: |
            models/heart_pipeline.joblib
            models/best_model.json

  docker:
    name: Build & smoke-test Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: heart-pipeline
          path: models

      - name: Build image
        run: docker build -t heart-api:ci .

      - name: Run container & probe /health
        run: |
          docker run -d --name heart-api -p 8000:8000 heart-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo OK; exit 0; fi
            sleep 2
          done
          docker logs heart-api
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f heart-api || true
